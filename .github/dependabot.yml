version: 2
updates:
  # bun is the project's package manager (bun.lock is the only lockfile —
  # package-lock.json was retired in D-069 because msedge-tts's
  # `preinstall: only-allow pnpm` guard fails every npm install).
  # Dependabot's npm_and_yarn ecosystem cannot update bun.lock; the "bun"
  # ecosystem can.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
