name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # dummy values — the build never queries the database (all pages are
      # dynamically rendered for the per-request CSP nonce), and no AI
      # service is called at build time. NOTE: NODE_ENV must NOT be set here —
      # it makes `npm ci` skip devDependencies (eslint/tsc missing) and
      # `next build` already implies production.
      DATABASE_URL: "file:./ci.db"
      ADMIN_PASSWORD: "ci-dummy-password"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (prisma generate + next build)
        run: npm run build

  # NOTE: scripts/pentest-local.sh / pentest-round2.sh are intentionally NOT
  # part of CI — they are live-server penetration harnesses that need a
  # running instance with a real local database. Run them locally per
  # docs/SECURITY.md §5 after any auth/API change.

  # Round-3 security regression suite (docs/SECURITY_REVIEW_2026-09-05-round3.md).
  # Needs Node >= 22.6 for --experimental-strip-types, so it runs as its own job
  # and does not build the app.
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Security regression suite (88 checks)
        run: node --expose-gc --experimental-strip-types scripts/security-checks.mts
